async function doReport(e,t){e.preventDefault();const f=e.target;const nm=f.n.value.trim(),rm=f.a.value+(f.rd.value.trim()?" – "+f.rd.value.trim():"");
 if(S.items.some(x=>x.by==S.me&&x.type==t&&x.name.toLowerCase()==nm.toLowerCase()&&x.room==rm&&x.date==f.dt.value.slice(0,10)))return toast("This looks like a duplicate of your earlier report.");
 let photo="";const file=f.p.files[0];if(file){photo=await new Promise(r=>{const im=new Image;im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,300/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};im.onerror=()=>r("");im.src=URL.createObjectURL(file)})}
 const n=S.items.filter(x=>x.type==t).length+1,rid=`CF-${t[0]}-2026-${pad(n)}`,cu=f.cu?f.cu.value:"";
 S.items.unshift({id:S.next++,rid,type:t,name:nm,category:f.c.value,brand:f.br.value.trim()||"Unknown",colour:f.co.value.trim()||"Unknown",desc:f.d.value.trim(),building:f.b.value,floor:f.f.value,room:rm,date:f.dt.value.slice(0,10),photo,status:t=="Found"&&cu.startsWith("Submitted")?"Awaiting Custody":"Reported",by:S.me,priv:f.x.value.trim()||"None provided",cond:f.cd?f.cd.value.trim():"",custody:cu,storage:"",msgs:[],inote:"",created:new Date().toLocaleString("en-IN"),notes:""});
 aud("report_created",rid);note(S.me,"Report "+rid+" was submitted.");
 S.flash=t=="Lost"?`Your lost-item report has been submitted. Your tracking ID is ${rid}. Keep it for reference; it is not proof of ownership.`:`Your found-item report has been submitted. Your tracking ID is ${rid}. Follow the custody instructions in your dashboard.`;save();go("/reports/"+rid)}

R["a-reports"]=()=>{const g=gate();if(g)return g;const q=qs(),v=k=>q.get(k)||"";
 const L=S.items.filter(i=>vis(i)&&(!v("b")||i.building==v("b"))&&(!v("f")||i.floor==v("f"))&&(!v("t")||i.type==v("t"))&&(!v("s")||i.status==v("s"))&&(!v("q")||(i.name+i.desc+i.rid).toLowerCase().includes(v("q").toLowerCase())));
 const ap=`go('/a-reports?b='+fb.value+'&f='+encodeURIComponent(ff.value)+'&t='+ft.value+'&s='+encodeURIComponent(fs.value)+'&q='+encodeURIComponent(fq.value))`;
 return `<h2>Reports queue</h2><div class="card"><div class="row"><div><label>Search</label><input id="fq" value="${esc(v("q"))}" onchange="${ap}"></div><div><label>Building</label><select id="fb" onchange="${ap}"><option value="">All</option>${BLD.map(b=>`<option value="${b[0]}" ${v("b")==b[0]?"selected":""}>${b[1]}</option>`).join("")}</select></div><div><label>Floor</label><select id="ff" onchange="${ap}"><option value="">All</option>${FLOORS.map(f=>`<option ${v("f")==f?"selected":""}>${f}</option>`).join("")}</select></div><div><label>Type</label><select id="ft" onchange="${ap}"><option value="">All</option><option ${v("t")=="Lost"?"selected":""}>Lost</option><option ${v("t")=="Found"?"selected":""}>Found</option></select></div><div><label>Status</label><select id="fs" onchange="${ap}"><option value="">All</option>${[...new Set([...FLOWL,...FLOWF,"Withdrawn","Closed"])].map(x=>`<option ${v("s")==x?"selected":""}>${x}</option>`).join("")}</select></div></div></div><p>${L.length} reports</p>
 <div class="wrap"><table><tr><th>ID</th><th>Item</th><th>Reported by</th><th>Submitted</th><th>Location</th><th>Status</th><th></th></tr>${L.map(i=>`<tr><td>${i.rid}</td><td>${ico(i)} ${esc(i.name)} ${pill(i.type)}</td><td>${who(i.by)}</td><td>${esc(i.created||i.date)}</td><td>${i.building} · ${esc(i.floor)} · ${esc(i.room)}</td><td>${pl(i.status)}</td><td><a class="btn sm" href="#/a-report/${i.rid}">Open</a></td></tr>`).join("")}</table></div>`};
R["a-report"]=rid=>{const g=gate();if(g)return g;const i=byRid(rid);if(!i||!vis(i))return deny();const ST=i.type=="Lost"?[...FLOWL,"Withdrawn","Closed"]:[...FLOWF,"Withdrawn","Closed"];
 return `<h2>${i.rid}</h2><p><a href="#/a-reports">← Reports queue</a></p><div class="card"><h3>${ico(i)} ${esc(i.name)} ${pill(i.type)} ${pl(i.status)}</h3><div class="wrap"><table>${rw("Reported by",who(i.by))}${rw("Submitted",esc(i.created||i.date))}${rw("Category",esc(i.category))}${rw("Brand / colour",esc(i.brand)+" / "+esc(i.colour))}${rw("Location",bn(i.building)+" · "+esc(i.floor)+" · "+esc(i.room))}${rw(i.type=="Lost"?"Date lost":"Date found",i.date)}${rw("Description",esc(i.desc))}${rw("Private details",esc(i.priv))}${i.type=="Found"?rw("Custody",esc(i.custody||"–"))+rw("Storage",esc(i.storage||"Not recorded")):""}${rw("Internal notes",esc(i.inote||"–"))}</table></div>${i.photo?`<p><img src="${i.photo}" alt="" style="max-width:240px;border:3px solid #000"></p>`:""}</div><br>
 <div class="card"><h3>Update status</h3><form onsubmit="setSt(event,'${i.rid}')"><div class="row"><div><label>Status</label><select name="s">${ST.map(s=>`<option ${s==i.status?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Reason</label><input name="r" required></div></div><br><button class="btn sm">Save status</button></form></div><br>
 <div class="card"><h3>Message to reporter (visible to them)</h3><form onsubmit="msg(event,'${i.rid}')"><input name="m" required maxlength="200"><br><br><button class="btn sm">Send</button></form><h3 style="margin-top:1rem">Internal note (staff only)</h3><form onsubmit="inote(event,'${i.rid}')"><textarea name="n" rows="2">${esc(i.inote)}</textarea><br><button class="btn sm">Save note</button></form></div>`};
function setSt(e,r){e.preventDefault();const i=byRid(r),f=e.target;aud("status:"+i.status+"→"+f.s.value,r,f.r.value);i.status=f.s.value;note(i.by,"Status of "+r+" changed to "+i.status+".");toast("Status updated");save();route()}
function msg(e,r){e.preventDefault();const i=byRid(r);i.msgs.push(e.target.m.value.trim());note(i.by,"New staff message on "+r);aud("message_sent",r);save();route()}
function inote(e,r){e.preventDefault();byRid(r).inote=e.target.n.value.trim();aud("internal_note",r);toast("Note saved");save()}
R["a-matches"]=()=>{const g=gate();if(g)return g;const FO=S.items.filter(f=>f.type=="Found"&&["Reported","Awaiting Custody","In Custody","Under Review"].includes(f.status)),P=[];
 S.items.filter(l=>vis(l)&&l.type=="Lost"&&["Reported","Under Review","Possible Match"].includes(l.status)).forEach(l=>FO.forEach(f=>{const s=score(l,f);if(s>=55)P.push({l,f,s})}));P.sort((a,b)=>b.s-a.s);
 const row=p=>`<tr><td>${p.l.rid}<br>${esc(p.l.name)}<br><small>${esc(p.l.floor)} · ${esc(p.l.room)}</small></td><td>${p.f.rid}<br>${esc(p.f.name)}<br><small>${bn(p.f.building)} · ${esc(p.f.floor)}</small></td><td><b>${p.s}%</b></td><td>${S.claims.some(c=>c.lostId==p.l.id&&c.itemId==p.f.id)?"Suggested":`<button class="btn sm" onclick="sugg(${p.l.id},${p.f.id})">Suggest to reporter</button>`}</td></tr>`;
 const G=BLD.map(b=>[b,P.filter(p=>p.l.building==b[0])]).filter(x=>x[1].length);
 return `<h2>Possible matches</h2><p class="note">Scores are triage hints only. They never approve a claim. Matches are grouped by the lost item's building.</p><div class="steps">${G.map(x=>`<a href="#/a-matches" onclick="document.getElementById('mb-${x[0][0]}').scrollIntoView({behavior:'smooth'});return false"><span>${x[0][0]} (${x[1].length})</span></a>`).join("")}</div>${G.length?G.map(x=>`<h3 id="mb-${x[0][0]}" style="margin-top:1.5rem;color:inherit">${x[0][1]} · ${x[1].length} possible match${x[1].length>1?"es":""}</h3><div class="wrap"><table><tr><th>Lost report</th><th>Found report</th><th>Hint</th><th></th></tr>${x[1].slice(0,15).map(row).join("")}</table></div>`).join(""):empty("No possible matches are available yet.")}`};
function sugg(l,f){const L=S.items.find(x=>x.id==l),F=S.items.find(x=>x.id==f);S.claims.push({id:Math.max(0,...S.claims.map(c=>c.id))+1,itemId:f,lostId:l,user:L.by,proof:"",status:"Pending",reason:""});L.status="Possible Match";F.status="Under Review";note(L.by,MSG.poss);aud("match_suggested",L.rid+" ↔ "+F.rid,"triage hint only");toast("Suggested to reporter");save();route()}
R["a-claims"]=()=>{const g=gate();if(g)return g;const C=[...S.claims].sort((a,b)=>ACTIVE_C.includes(b.status)-ACTIVE_C.includes(a.status));
 return `<h2>Claims review</h2>${C.length?C.map(c=>{const f=S.items.find(x=>x.id==c.itemId),l=S.items.find(x=>x.id==c.lostId);if(!f||!vis(f))return"";const act=ACTIVE_C.includes(c.status);
 return `<div class="card" style="margin-bottom:1rem"><h3>${cid(c)} · ${esc(f.name)} ${pl(c.status)}</h3><p>Claimant: <b>${who(c.user)}</b> · Found: <a href="#/a-report/${f.rid}">${f.rid}</a>${l?` · Lost: <a href="#/a-report/${l.rid}">${l.rid}</a>`:""}</p><p><b>Evidence:</b> ${esc(c.proof||"Not submitted yet")}<br><b>Found-item private details:</b> ${esc(f.priv)}${l?`<br><b>Lost-report private details:</b> ${esc(l.priv)}`:""}</p>${c.reason?`<p class="mute">Last reason: ${esc(c.reason)}</p>`:""}${HV.includes(f.category)?`<p class="note">High-value item: in-person verification required.</p>`:""}
 ${act?`<button class="btn sm" onclick="cact(${c.id},'ev')">Request more evidence</button> <button class="btn sm gold" onclick="cact(${c.id},'ok')">Approve for handover</button> <button class="btn sm red" onclick="cact(${c.id},'no')">Reject</button> <button class="btn sm ghost" onclick="cact(${c.id},'dup')">Close duplicate</button>`:""}</div>`}).join(""):empty("No cases require action right now.")}`};
function cact(id,a){const c=S.claims.find(x=>x.id==id),f=S.items.find(x=>x.id==c.itemId),l=S.items.find(x=>x.id==c.lostId);let r="";
 if(a!="ok"){r=prompt("Reason (required):");if(!r||!r.trim())return toast("A reason is required.");r=r.trim()}
 if(a=="ok"){if(!c.proof)return toast("No evidence submitted yet. Request evidence first.");if(S.claims.some(x=>x.itemId==c.itemId&&x.status=="Approved"&&x.id!=c.id))return toast("Another claim is already approved for this item.");
  if(HV.includes(f.category)&&!confirm("High-value item. Confirm that in-person verification with university ID will be completed before handover."))return;
  c.status="Approved";f.status="Approved for Handover";if(l)l.status="Verification Required";note(c.user,MSG.ok);aud("claim_approved",cid(c),"Approved for handover")}
 if(a=="ev"){c.status="More Evidence Requested";c.reason=r;note(c.user,"Staff requested more evidence for claim "+cid(c)+".");aud("evidence_requested",cid(c),r)}
 if(a=="no"){c.status="Rejected";c.reason=r;note(c.user,MSG.no);aud("claim_rejected",cid(c),r);if(!S.claims.some(x=>x.itemId==f.id&&x.id!=c.id&&["Pending","Under Review","More Evidence Requested","Approved"].includes(x.status))&&f.status=="Under Review")f.status="In Custody"}
 if(a=="dup"){c.status="Closed as Duplicate";c.reason=r;aud("claim_closed_duplicate",cid(c),r)}
 toast("Claim updated");save();route()}
R["a-storage"]=()=>{const g=gate();if(g)return g;const L=S.items.filter(i=>vis(i)&&i.type=="Found"&&["Reported","Awaiting Custody","In Custody","Under Review","Claim Pending"].includes(i.status));
 return `<h2>Stored items</h2><p class="note">Exact storage locations are staff-only. Share handover instructions only after claim approval.</p>${L.length?`<div class="wrap"><table><tr><th>ID</th><th>Item</th><th>Custody</th><th>Status</th><th>Storage (desk / cabinet)</th></tr>${L.map(i=>`<tr><td>${i.rid}</td><td>${esc(i.name)}</td><td>${esc(i.custody||"–")}</td><td>${pl(i.status)}</td><td><input id="st${i.id}" value="${esc(i.storage)}" maxlength="80"> <button class="btn sm" onclick="stor(${i.id})">Save</button></td></tr>`).join("")}</table></div>`:empty("No items in custody.")}`};
function stor(id){const i=S.items.find(x=>x.id==id),v=document.getElementById("st"+id).value.trim();if(!v)return toast("Enter a storage location.");i.storage=v;if(["Reported","Awaiting Custody"].includes(i.status))i.status="In Custody";aud("storage_recorded",i.rid);toast("Storage recorded");save();route()}
R["a-handover"]=()=>{const g=gate();if(g)return g;const C=S.claims.filter(c=>c.status=="Approved"&&(S.items.find(x=>x.id==c.itemId)||{}).status=="Approved for Handover"&&vis(S.items.find(x=>x.id==c.itemId)));
 return `<h2>Handover</h2>${C.length?C.map(c=>{const f=S.items.find(x=>x.id==c.itemId);return `<div class="card" style="margin-bottom:1rem"><h3>${cid(c)} · ${esc(f.name)}</h3><p>Claimant: <b>${esc(c.user)}</b><br>Storage: ${esc(f.storage||"Not recorded")}</p>${["Claimant verified in person against university ID","Item-specific proof matched private details","Owner acknowledged receipt"].map(t=>`<label><input type="checkbox" class="hc${c.id}" style="width:auto"> ${t}</label>`).join("")}<br><button class="btn sm gold" onclick="hand(${c.id})">Record handover</button></div>`}).join(""):empty("No handovers awaiting.")}
 <h3 style="color:inherit;margin-top:2rem">Handover log</h3>${S.handovers.length?`<div class="wrap"><table><tr><th>Claim</th><th>Item</th><th>Staff</th><th>When</th></tr>${S.handovers.map(h=>`<tr><td>${h.c}</td><td>${esc(h.i)}</td><td>${esc(h.s)}</td><td>${h.t}</td></tr>`).join("")}</table></div>`:"<p>No handovers recorded yet.</p>"}`};
function hand(id){if(![...document.querySelectorAll(".hc"+id)].every(x=>x.checked))return toast("Complete every verification step first.");
 const c=S.claims.find(x=>x.id==id),f=S.items.find(x=>x.id==c.itemId),l=S.items.find(x=>x.id==c.lostId);f.status="Returned/Closed";if(l)l.status="Resolved";
 S.claims.filter(x=>x.itemId==f.id&&x.id!=c.id&&ACTIVE_C.includes(x.status)).forEach(x=>{x.status="Closed as Duplicate";x.reason="Item returned to verified owner";aud("claim_closed",cid(x),"Item returned to another claimant")});
 S.handovers.unshift({c:cid(c),i:f.rid+" "+f.name,s:S.me,t:new Date().toLocaleString("en-IN")});aud("handover_recorded",cid(c),f.rid);note(c.user,"Handover recorded. Your case is closed.");toast("Handover recorded");save();route()}
R["a-audit"]=()=>{const g=gate();if(g||myB())return g||deny();return `<h2>Audit log</h2>${S.audit.length?`<div class="wrap"><table><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Reason</th></tr>${S.audit.slice(0,200).map(a=>`<tr><td>${a.t}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.reason)}</td></tr>`).join("")}</table></div>`:empty("No actions recorded yet.")}<p><button class="btn ghost sm" onclick="if(confirm('Reset all data?')){localStorage.removeItem('cf');location.reload()}">Reset data</button></p>`};
window.go=go;
function nav(){const u=me(),p=location.hash.split("?")[0]||"#/",un=u?S.notes.filter(n=>n.to==S.me&&!n.read).length:0;
 const L=!u?[["Home","#/"],["How it works","#/how"],["Privacy","#/privacy"],["FAQ","#/faq"],["Login","#/login"],["Register","#/register"]]:u.role=="admin"?[[u.bld?"My building":"Overview",u.bld?"#/a-building/"+u.bld:"#/admin"],["Reports","#/a-reports"],["Matches","#/a-matches"],["Claims","#/a-claims"],["Storage","#/a-storage"],["Handover","#/a-handover"],["Audit","#/a-audit"]]:[["Dashboard","#/dashboard"],["Report lost","#/new/Lost"],["Report found","#/new/Found"],["My reports","#/myreports"],["My claims","#/myclaims"],["Alerts"+(un?" ("+un+")":""),"#/notifications"],["Profile","#/profile"],["Help","#/faq"]];
 $("#nav").innerHTML=`<a class="logo" href="#/"><img class="lg" src="${LOGO}" alt="RBU logo">Campus<b>Find</b></a>${L.filter(l=>!(u&&u.bld&&l[0]=="Audit")).map(l=>`<a href="${l[1]}" class="${p==l[1]?"on":""}">${l[0]}</a>`).join("")}${u?`<a href="#/" onclick="logout()">Log out</a>`:""}`}
function route(){if(S.me&&S.exp&&Date.now()>S.exp){S.me=null;save();toast("Session expired. Please log in again.")}
 const h=(location.hash||"#/").slice(1).split("?")[0].split("/").filter(Boolean),k=h[0]||"home",fn=R[k]||R.home;
 $("#app").innerHTML=fn(...h.slice(1).map(decodeURIComponent));nav();window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
