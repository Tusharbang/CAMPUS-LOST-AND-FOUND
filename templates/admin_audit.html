{% extends "base.html" %}{% block body %}<h2>Audit log</h2>{% if rows %}<div class="wrap"><table><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Reason</th></tr>{% for a in rows %}<tr><td>{{ a.ts }}</td><td>{{ a.actor }}</td><td>{{ a.action }}</td><td>{{ a.entity }}</td><td>{{ a.reason }}</td></tr>{% endfor %}</table></div>{% else %}<div class="card"><p>No actions recorded yet.</p></div>{% endif %}{% endblock %}
