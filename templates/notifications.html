{% extends "base.html" %}{% block body %}<h2>Notifications</h2>{% for n in rows %}<div class="card" style="margin-bottom:.5rem">{% if not n.is_read %}<b>NEW · </b>{% endif %}{{ n.message }}<br><small>{{ n.created_at }}</small>{% if not n.is_read %}<form method="post" style="display:inline">{{ csrf() }}<input type="hidden" name="id" value="{{ n.id }}"> <button class="btn sm">Mark read</button></form>{% endif %}</div>{% else %}<div class="card"><p>No notifications yet.</p></div>{% endfor %}{% endblock %}
