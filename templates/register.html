{% extends "base.html" %}{% block body %}<h2>Create account</h2><div class="card" style="max-width:420px"><form method="post">{{ csrf() }}<label>Full name</label><input name="name" required><label>Student ID</label><input name="student_id" required><label>University email</label><input name="email" type="email" required placeholder="yourname@rbunagpur.in"><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required><label>Confirm password</label><input name="confirm" type="password" required><label><input type="checkbox" name="consent" required> I consent to my reports being processed by CampusFind staff.</label><br><button class="btn">Register</button></form></div>{% endblock %}
