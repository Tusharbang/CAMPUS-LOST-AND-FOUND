{% extends "base.html" %}{% block body %}<h2>Profile</h2><div class="card" style="max-width:480px"><p><b>{{ g.user.email }}</b> <span class="pill sok">Verified account</span><br><small>Role: {{ g.user.role }} (changed only by an admin)</small></p><form method="post">{{ csrf() }}<label>Full name</label><input name="name" value="{{ g.user.full_name }}" required><label>New password (optional)</label><input name="new" type="password" minlength="8"><label>Current password (needed to change password)</label><input name="current" type="password"><br><br><button class="btn">Save</button></form></div>{% endblock %}
