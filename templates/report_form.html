{% extends "base.html" %}{% block body %}{% set L = t == 'Lost' %}<h2>Report {{ t|lower }} item</h2><p class="note">Do not enter passwords, OTPs or unnecessary sensitive data. Private details are visible only to you and authorized staff.</p>
<div class="card"><form method="post" enctype="multipart/form-data">{{ csrf() }}
<div class="row"><div><label>Item name *</label><input name="name" required maxlength="80" value="{{ f.get('name','') }}"></div><div><label>Category *</label><select name="category">{% for c in CATS %}<option {{ 'selected' if f.get('category') == c }}>{{ c }}</option>{% endfor %}</select></div><div><label>Brand</label><input name="brand" placeholder="Unknown" maxlength="40"></div><div><label>Colour</label><input name="colour" placeholder="Unknown" maxlength="30"></div></div>
<div class="row"><div><label>Approx. {{ 'lost' if L else 'found' }} date and time *</label><input name="when" type="datetime-local" required value="{{ f.get('when','') }}"></div></div>
<div class="row"><div><label>Building *</label><select name="building" required onchange="this.form.floor.disabled=this.form.area.disabled=!this.value"><option value="">Select…</option>{% for c, n in BUILDINGS %}<option value="{{ c }}" {{ 'selected' if f.get('building') == c }}>{{ n }}</option>{% endfor %}</select></div>
<div><label>Floor *</label><select name="floor" required {{ '' if f.get('building') else 'disabled' }}>{% for x in FLOORS %}<option {{ 'selected' if f.get('floor') == x }}>{{ x }}</option>{% endfor %}</select></div>
<div><label>Room / area *</label><select name="area" required {{ '' if f.get('building') else 'disabled' }}>{% for x in AREAS %}<option {{ 'selected' if f.get('area') == x }}>{{ x }}</option>{% endfor %}</select></div><div><label>Room detail (optional)</label><input name="room_detail" maxlength="40"></div></div>
<label>General description *</label><textarea name="description" rows="3" required maxlength="300">{{ f.get('description','') }}</textarea>
{% if not L %}<div class="row"><div><label>Condition</label><input name="condition" maxlength="60"></div><div><label>Custody *</label><select name="custody"><option>Holding it temporarily</option><option>Submitted to authorized staff</option></select></div></div>{% endif %}
<label>{{ 'Private identification details (scratch, sticker, hidden mark, contents…)' if L else 'Private details you noticed (staff only, optional)' }}</label><textarea name="private" rows="2" maxlength="300"></textarea>
<label>Photo (optional, private, PNG/JPG/WEBP up to 2 MB)</label><input name="photo" type="file" accept="image/png,image/jpeg,image/webp"><br><button class="btn">Submit report</button></form></div>{% endblock %}
